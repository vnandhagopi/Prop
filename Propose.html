<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Akshara ❤️</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        screens: { 'xs': '375px' }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ CUSTOM CSS ============ */
  :root{
    --ink-950:#050914;
    --ink-900:#070d1e;
    --ink-800:#0b1530;
    --ink-700:#0f1c40;
    --blue-glow:#5eb8ff;
    --blue-soft:#8fd0ff;
    --blue-deep:#2f6fed;
    --rose:#ff9fc0;
  }

  *{ -webkit-tap-highlight-color: transparent; }

  html,body{
    background: var(--ink-950);
    overscroll-behavior: none;
  }

  body{
    font-family:'Manrope', sans-serif;
    color:#eaf2ff;
    min-height:100svh;
    min-height:100dvh;
    overflow-x:hidden;
    position:relative;
  }

  .font-display{ font-family:'Cormorant Garamond', serif; }
  .font-malayalam{ font-family:'Noto Sans Malayalam', sans-serif; }

  /* Prevent any horizontal scroll globally */
  #app{ overflow-x:hidden; width:100%; }

  /* ---------- Background atmosphere ---------- */
  .bg-atmosphere{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 45% at 18% 12%, rgba(47,111,237,0.30), transparent 60%),
      radial-gradient(55% 40% at 85% 20%, rgba(94,184,255,0.16), transparent 60%),
      radial-gradient(70% 55% at 50% 100%, rgba(19,32,74,0.55), transparent 60%),
      linear-gradient(180deg, var(--ink-950), var(--ink-900) 40%, #040712 100%);
  }

  .grain-vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    box-shadow: inset 0 0 18vw rgba(0,0,0,0.55);
  }

  .blur-orb{
    position:absolute; border-radius:9999px; filter:blur(60px);
    opacity:0.35; animation: drift 14s ease-in-out infinite;
  }

  @keyframes drift{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(10px,-16px) scale(1.06); }
  }

  /* Twinkling stars */
  .star{
    position:absolute; width:2px; height:2px; background:#bfe3ff; border-radius:50%;
    opacity:0.6; animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(1); }
    50%{ opacity:0.9; transform:scale(1.6); }
  }

  /* Floating hearts */
  .fheart{
    position:absolute; bottom:-10%; color:var(--blue-glow);
    opacity:0; filter: drop-shadow(0 0 6px rgba(94,184,255,0.7));
    animation-name: floatUp;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity:0; }
    10%{ opacity:0.85; }
    50%{ transform: translateY(-50vh) translateX(12px) rotate(8deg) scale(1); }
    90%{ opacity:0.6; }
    100%{ transform: translateY(-105vh) translateX(-10px) rotate(-6deg) scale(0.9); opacity:0; }
  }

  /* ---------- Glass card ---------- */
  .glass-card{
    background: linear-gradient(180deg, rgba(20,32,64,0.55), rgba(8,14,32,0.65));
    border: 1px solid rgba(140,190,255,0.16);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 20px 60px -20px rgba(0,0,0,0.7),
      0 0 40px -10px rgba(58,120,255,0.15);
  }

  .glow-text{
    text-shadow: 0 0 18px rgba(94,184,255,0.55), 0 0 46px rgba(94,184,255,0.22);
  }

  /* ---------- Buttons ---------- */
  .btn-primary{
    background: linear-gradient(135deg, #3a7bff, #6fc3ff);
    box-shadow: 0 8px 30px -8px rgba(58,123,255,0.65), 0 0 0 1px rgba(255,255,255,0.08) inset;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn-primary:hover{ transform: translateY(-2px); filter:brightness(1.08); box-shadow: 0 10px 34px -6px rgba(58,123,255,0.8); }
  .btn-primary:active{ transform: translateY(0) scale(0.97); }

  .btn-ghost{
    border:1px solid rgba(150,195,255,0.28);
    background: rgba(255,255,255,0.02);
    transition: transform .18s ease, background .18s ease, border-color .18s ease;
  }
  .btn-ghost:hover{ background: rgba(150,195,255,0.08); border-color: rgba(150,195,255,0.5); }
  .btn-ghost:active{ transform: scale(0.96); }

  .btn-no{
    transition: transform .12s ease, top .35s cubic-bezier(.22,1,.36,1), left .35s cubic-bezier(.22,1,.36,1);
  }

  /* ---------- Step transition ---------- */
  .step-panel{
    animation: stepIn .55s cubic-bezier(.22,1,.36,1) both;
  }
  .step-panel.leaving{
    animation: stepOut .28s ease both;
  }
  @keyframes stepIn{
    0%{ opacity:0; transform: translateY(18px) scale(0.98); filter: blur(6px); }
    100%{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes stepOut{
    0%{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
    100%{ opacity:0; transform: translateY(-14px) scale(0.98); filter: blur(4px); }
  }

  /* Progress bar */
  .progress-track{ background: rgba(255,255,255,0.08); }
  .progress-fill{
    background: linear-gradient(90deg, #3a7bff, #8fd0ff);
    transition: width .5s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 0 12px rgba(94,184,255,0.6);
  }

  /* Screens container */
  .screen{
    min-height:100svh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
  }

  /* Celebration hearts burst */
  .burst-heart{
    position:absolute; bottom:0; opacity:0; color:var(--blue-glow);
    animation-name: burstUp; animation-timing-function: ease-out; animation-iteration-count:1;
    filter: drop-shadow(0 0 8px rgba(94,184,255,0.8));
  }
  @keyframes burstUp{
    0%{ transform: translateY(0) scale(0.6) rotate(0); opacity:0; }
    12%{ opacity:1; }
    100%{ transform: translateY(-100vh) translateX(var(--dx,0px)) scale(1.1) rotate(var(--rot,20deg)); opacity:0; }
  }

  .pulse-soft{ animation: pulseSoft 2.6s ease-in-out infinite; }
  @keyframes pulseSoft{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.05); }
  }

  /* Focus visibility for accessibility */
  button:focus-visible{
    outline: 2px solid var(--blue-soft);
    outline-offset: 3px;
    border-radius: 10px;
  }

  /* Safe-area padding to avoid mobile browser chrome */
  .safe-bottom{ padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
  .safe-top{ padding-top: max(1.25rem, env(safe-area-inset-top)); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="bg-atmosphere"></div>
<div class="grain-vignette"></div>
<div id="bgFX" class="fixed inset-0 z-0 pointer-events-none overflow-hidden"></div>

<div id="app" class="relative z-10"></div>

<script>
/* =========================================================================
   CONFIGURATION — all user-facing text lives here.
   Change `name` or any `steps` entry and the whole experience updates.
   ========================================================================= */
const confessionData = {
  name: "Akshara",

  opening: {
    eyebrow: "A little something I wanted to tell you...",
    greetingSuffix: "...", // e.g. becomes "Akshara ..." — kept plain and warm
    subtext: "Can you give me a few seconds?",
    startButton: "Start ❤️"
  },

  steps: [
    {
      title: "Oru small confession...",
      text: "Un kuda pesuradhu enakku romba pidikkum."
    },
    {
      title: "Edhachum pesa start pannalum...",
      text: "Random ah pesa start pannalum kooda, unkitta pesurappo athu automatic ah interesting aagidum."
    },
    {
      title: "Night stories...",
      text: "Sleep varaadha neram nee oru story start pannina, andha moment enakku romba pidikkum. Un voice adhula ennamo iruku ma"
    },
    {
      title: "Unna pathi sollurapo...",
      text: "Nee chinna chinna vishayam share pannumbodhu, naan full kavanama kekkuren."
    },
    {
      title: "Video call moments...",
      text: "Video call la unna paakura andha short time, i just want to stare at you. Sometimes onnume pesama, unna paathukittu irukkanum nu thonum."
    },
  ],

  preFinalTransition: {
    line1: "Naan romba naala sollanum nu nenachu vecha oru vishayam irukku.",
    line2: "Ippo indha chance ah miss panna kudathunu nenaikuren.",
    line3: "Ippovum naan silent ah irukka virumbala,",
    closingLine: "So... one thing.",
    button: "Sollattuma? ❤️"
  },

  finalConfession: {
    malayalamText: "enikku ninne ishtamaanu... njaan ninne snehikkunnu. ❤️",
    subline: "Idhu than andha vishayam.",
    question: "Will you be mine? ❤️"
  },

  yesResponse: {
    heading: "You just made this little heart very happy. ❤️",
    subtext: "Ippo romba santhosham irukku."
  },

  buttons: {
    next: ["Konjam next polaama? →", "Next ❤️", "Innum konjam...", "Continue →", "One more...", "Almost there ❤️"],
    prev: "← Back",
    yes: "YES ❤️",
    no: "NO 🙈"
  }
};

/* =========================================================================
   NOTIFICATIONS (optional) — pings you the moment she responds.
   Uses ntfy.sh, a free push-notification service. No account or API key
   needed. Just pick a random, hard-to-guess topic name below, then either:
     a) install the ntfy app and subscribe to that topic name, or
     b) open https://ntfy.sh/your-topic-name in a browser tab and leave it open.
   Set `enabled: false` to turn this off completely.
   ========================================================================= */
const notifyConfig = {
  enabled: true,
  topic: "propose-reply", // change this to something random & private
  notifyOnYes: true,
  notifyOnNoHover: true // fires once, the first time she tries the NO button
};

function sendNotification(message){
  if(!notifyConfig.enabled) return;
  fetch(`https://ntfy.sh/${notifyConfig.topic}`, {
    method: 'POST',
    body: message
  }).catch(() => { /* fail silently — never let this break her experience */ });
}

/* =========================================================================
   APP STATE & LOGIC
   ========================================================================= */
const app = document.getElementById('app');
const bgFX = document.getElementById('bgFX');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let currentStep = -1; // -1 = opening screen
const TOTAL_STEPS = confessionData.steps.length;

/* ---------- Background ambient effects (stars + floating hearts) ---------- */
function buildAmbient(){
  bgFX.innerHTML = '';
  // soft blur orbs
  const orb1 = document.createElement('div');
  orb1.className = 'blur-orb';
  orb1.style.cssText = 'width:38vw;height:38vw;left:-10vw;top:5vh;background:#2f6fed;';
  const orb2 = document.createElement('div');
  orb2.className = 'blur-orb';
  orb2.style.cssText = 'width:32vw;height:32vw;right:-8vw;bottom:10vh;background:#5eb8ff;animation-delay:2s;';
  bgFX.appendChild(orb1);
  bgFX.appendChild(orb2);

  if(reduceMotion) return;

  // stars
  const starCount = window.innerWidth < 640 ? 26 : 42;
  for(let i=0;i<starCount;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (2.4+Math.random()*2)+'s';
    bgFX.appendChild(s);
  }

  // floating hearts
  const heartCount = window.innerWidth < 640 ? 6 : 10;
  for(let i=0;i<heartCount;i++){
    const h = document.createElement('div');
    h.className = 'fheart';
    h.innerHTML = '❤';
    h.style.left = (Math.random()*90+5)+'%';
    h.style.fontSize = (12+Math.random()*16)+'px';
    h.style.animationDuration = (9+Math.random()*8)+'s';
    h.style.animationDelay = (Math.random()*10)+'s';
    bgFX.appendChild(h);
  }
}
buildAmbient();
window.addEventListener('resize', () => { buildAmbient(); });

/* ---------- Rendering helpers ---------- */
function pickButtonLabel(index){
  const labels = confessionData.buttons.next;
  return labels[index % labels.length];
}

function renderOpening(){
  app.innerHTML = `
    <section class="screen px-6">
      <div class="step-panel glass-card rounded-3xl w-full max-w-md mx-auto p-6 sm:p-10 text-center safe-top safe-bottom">
        <p class="text-xs sm:text-sm tracking-wide text-blue-200/70 mb-5 font-medium">${confessionData.opening.eyebrow}</p>
        <h1 class="font-display italic text-3xl xs:text-4xl sm:text-5xl text-blue-50 glow-text mb-4 break-words">
          ${confessionData.name} ${confessionData.opening.greetingSuffix}
        </h1>
        <p class="text-blue-100/80 text-sm sm:text-lg mb-8">${confessionData.opening.subtext}</p>
        <button id="startBtn" class="btn-primary text-white font-semibold text-sm sm:text-lg px-7 sm:px-8 py-3 sm:py-3.5 rounded-full pulse-soft">
          ${confessionData.opening.startButton}
        </button>
      </div>
    </section>
  `;
  document.getElementById('startBtn').addEventListener('click', () => goToStep(0));
}

function renderStepIndicator(index){
  const num = String(index+1).padStart(2,'0');
  const total = String(TOTAL_STEPS).padStart(2,'0');
  const pct = ((index+1)/TOTAL_STEPS)*100;
  return `
    <div class="mb-6">
      <div class="flex items-center justify-between mb-3">
        <span class="font-display italic text-blue-200/70 text-sm tracking-widest">${num} / ${total}</span>
        <span class="text-[10px] uppercase tracking-[0.2em] text-blue-300/50">${confessionData.name}</span>
      </div>
      <div class="progress-track h-1 rounded-full w-full overflow-hidden">
        <div class="progress-fill h-full rounded-full" style="width:${pct}%"></div>
      </div>
    </div>
  `;
}

function renderStep(index, direction='forward'){
  const step = confessionData.steps[index];
  const isFirst = index === 0;
  app.innerHTML = `
    <section class="screen px-6">
      <div class="step-panel glass-card rounded-3xl w-full max-w-lg mx-auto p-6 sm:p-10 safe-top safe-bottom">
        
        <h2 class="font-display text-2xl xs:text-3xl sm:text-4xl text-blue-50 glow-text mb-3 leading-snug">${step.title}</h2>
        <p class="text-blue-100/85 text-sm sm:text-lg leading-relaxed mb-8">${step.text}</p>
        <div class="flex items-center gap-3 ${isFirst ? 'justify-end' : 'justify-between'}">
          ${isFirst ? '' : `<button id="prevBtn" class="btn-ghost text-blue-100 text-xs sm:text-base px-4 sm:px-5 py-2.5 sm:py-3 rounded-full" aria-label="Go to previous step">${confessionData.buttons.prev}</button>`}
          <button id="nextBtn" class="btn-primary text-white font-semibold text-xs sm:text-base px-5 sm:px-6 py-2.5 sm:py-3 rounded-full" aria-label="Go to next step">
            ${pickButtonLabel(index)}
          </button>
        </div>
      </div>
    </section>
  `;
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  nextBtn.addEventListener('click', () => {
    if(index === TOTAL_STEPS - 1){
      goToPreFinal();
    } else {
      goToStep(index + 1);
    }
  });
  if(prevBtn){
    prevBtn.addEventListener('click', () => goToStep(index - 1));
  }
}

function goToStep(index){
  currentStep = index;
  renderStep(index);
}

/* ---------- Pre-final emotional transition ---------- */
function goToPreFinal(){
  const d = confessionData.preFinalTransition;
  app.innerHTML = `
    <section class="screen px-6">
      <div class="step-panel w-full max-w-lg mx-auto text-center safe-top safe-bottom px-1">
        <p class="font-display italic text-xl sm:text-3xl text-blue-100/90 leading-relaxed mb-4">${d.line1}</p>
        <p class="font-display italic text-xl sm:text-3xl text-blue-50 glow-text leading-relaxed mb-6">${d.line2}</p>
        <p class="text-blue-200/70 text-sm sm:text-base leading-relaxed mb-8">${d.line3} <span class="text-blue-50">${confessionData.name} ma.</span></p>
        <p class="text-blue-100/80 text-base sm:text-lg mb-7">${d.closingLine}</p>
        <button id="toFinalBtn" class="btn-primary text-white font-semibold text-base sm:text-lg px-8 py-3.5 rounded-full pulse-soft">
          ${d.button}
        </button>
      </div>
    </section>
  `;
  document.getElementById('toFinalBtn').addEventListener('click', renderFinalConfession);
}

/* ---------- Final Malayalam confession + Yes/No ---------- */
function renderFinalConfession(){
  const f = confessionData.finalConfession;
  app.innerHTML = `
    <section class="screen px-6">
      <div class="step-panel glass-card rounded-3xl w-full max-w-lg mx-auto p-6 sm:p-12 text-center relative overflow-visible safe-top safe-bottom">
        <p class="text-xs tracking-[0.25em] uppercase text-blue-300/60 mb-5">${confessionData.name}</p>
        <p class="font-malayalam text-xl xs:text-2xl sm:text-4xl text-blue-50 glow-text leading-relaxed mb-5 break-words" lang="ml">
          ${f.malayalamText}
        </p>
        <p class="text-blue-200/70 text-xs sm:text-base mb-6">${f.subline}</p>
        <p class="font-display italic text-xl sm:text-3xl text-blue-100 mb-8">${f.question}</p>

        <div id="btnWrap" class="relative flex items-center justify-center gap-3 sm:gap-4 h-14">
          <button id="yesBtn" class="btn-primary text-white font-semibold text-sm sm:text-lg px-6 sm:px-8 py-3 sm:py-3.5 rounded-full pulse-soft" aria-label="Yes, I accept">
            ${confessionData.buttons.yes}
          </button>
          <button id="noBtn" class="btn-no btn-ghost text-blue-100 font-semibold text-sm sm:text-lg px-6 sm:px-8 py-3 sm:py-3.5 rounded-full" aria-label="No">
            ${confessionData.buttons.no}
          </button>
        </div>
      </div>
    </section>
  `;

  document.getElementById('yesBtn').addEventListener('click', celebrateYes);
  setupDodgingNoButton();
}

/* ---------- Playful, un-clickable NO button ---------- */
function setupDodgingNoButton(){
  const noBtn = document.getElementById('noBtn');
  const wrap = document.getElementById('btnWrap');
  let dodging = false;
  let noHoverNotified = false;

  // Use the visual viewport when available — on mobile, window.innerWidth/
  // innerHeight can be stale or include area hidden behind the browser's
  // address bar / home-indicator, which is what let the button drift into
  // a non-visible area. visualViewport tracks what's actually on screen.
  function getViewport(){
    const vv = window.visualViewport;
    if(vv){
      return {
        width: vv.width,
        height: vv.height,
        offsetLeft: vv.offsetLeft,
        offsetTop: vv.offsetTop
      };
    }
    return {
      width: document.documentElement.clientWidth,
      height: document.documentElement.clientHeight,
      offsetLeft: 0,
      offsetTop: 0
    };
  }

  function clampToViewport(){
    if(noBtn.style.position !== 'fixed') return;
    const view = getViewport();
    const r = noBtn.getBoundingClientRect();
    const margin = 16;
    const safeBottom = 24; // keep clear of mobile home-indicator / gesture bar

    const minLeft = view.offsetLeft + margin;
    const minTop = view.offsetTop + margin;
    const maxLeft = Math.max(minLeft, view.offsetLeft + view.width - r.width - margin);
    const maxTop = Math.max(minTop, view.offsetTop + view.height - r.height - safeBottom);

    const clampedLeft = Math.min(Math.max(r.left, minLeft), maxLeft);
    const clampedTop = Math.min(Math.max(r.top, minTop), maxTop);

    noBtn.style.left = clampedLeft + 'px';
    noBtn.style.top = clampedTop + 'px';
  }

  function dodge(){
    if(dodging) return;
    dodging = true;

    if(notifyConfig.notifyOnNoHover && !noHoverNotified){
      noHoverNotified = true;
      sendNotification(`${confessionData.name} tried to click NO 🙈`);
    }

    const view = getViewport();
    const btnRect = noBtn.getBoundingClientRect();

    // Work out safe bounds within the *visible* viewport, with margin from edges.
    const margin = 16;
    const safeBottom = 24; // keep clear of mobile home-indicator / gesture bar

    const minLeft = view.offsetLeft + margin;
    const minTop = view.offsetTop + margin;
    const maxLeft = Math.max(minLeft, view.offsetLeft + view.width - btnRect.width - margin);
    const maxTop = Math.max(minTop, view.offsetTop + view.height - btnRect.height - safeBottom);

    // Switch to fixed positioning on first dodge so it can roam the viewport.
    if(noBtn.style.position !== 'fixed'){
      noBtn.style.position = 'fixed';
      noBtn.style.left = btnRect.left + 'px';
      noBtn.style.top = btnRect.top + 'px';
      noBtn.style.zIndex = '50';
      noBtn.style.margin = '0';
    }

    let newLeft, newTop, attempts = 0;
    do {
      newLeft = minLeft + Math.random() * (maxLeft - minLeft);
      newTop = minTop + Math.random() * (maxTop - minTop);
      attempts++;
    } while (
      attempts < 8 &&
      Math.hypot(newLeft - btnRect.left, newTop - btnRect.top) < 90
    );

    noBtn.style.left = newLeft + 'px';
    noBtn.style.top = newTop + 'px';

    setTimeout(() => { dodging = false; }, 60);
  }

  // Desktop: dodge on click.
  noBtn.addEventListener('click', (e) => { e.preventDefault(); dodge(); });

  // Mobile: dodge on tap. touchstart fires before click, so this also
  // prevents the tap from ever landing — but neither fires just from hovering.
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, { passive:false });

  // Keep it in-bounds whenever the visible viewport changes — window resize,
  // orientation change, or the mobile browser's address bar showing/hiding
  // (which fires visualViewport events, not always a window resize).
  window.addEventListener('resize', clampToViewport);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', clampToViewport);
    window.visualViewport.addEventListener('scroll', clampToViewport);
  }
}

/* ---------- YES celebration ---------- */
function celebrateYes(){
  const y = confessionData.yesResponse;

  sendNotification(`${confessionData.name} clicked YES! ❤️`);

  // Heart burst
  if(!reduceMotion){
    const burstLayer = document.createElement('div');
    burstLayer.className = 'fixed inset-0 z-40 pointer-events-none overflow-hidden';
    document.body.appendChild(burstLayer);
    const count = window.innerWidth < 640 ? 22 : 34;
    for(let i=0;i<count;i++){
      const h = document.createElement('div');
      h.className = 'burst-heart';
      h.innerHTML = '❤';
      h.style.left = Math.random()*100+'%';
      h.style.fontSize = (14+Math.random()*22)+'px';
      h.style.setProperty('--dx', (Math.random()*160-80)+'px');
      h.style.setProperty('--rot', (Math.random()*60-30)+'deg');
      h.style.animationDuration = (2.4+Math.random()*1.6)+'s';
      h.style.animationDelay = (Math.random()*0.8)+'s';
      burstLayer.appendChild(h);
    }
    setTimeout(() => burstLayer.remove(), 4200);
  }

  app.innerHTML = `
    <section class="screen px-6">
      <div class="step-panel glass-card rounded-3xl w-full max-w-lg mx-auto p-8 sm:p-12 text-center safe-top safe-bottom">
        <div class="text-5xl mb-6">❤️</div>
        <h2 class="font-display italic text-3xl sm:text-4xl text-blue-50 glow-text mb-5 leading-snug">${y.heading}</h2>
        <p class="text-blue-100/80 text-base sm:text-lg leading-relaxed">${y.subtext}</p>
      </div>
    </section>
  `;
}

/* ---------- Boot ---------- */
renderOpening();
</script>
</body>
</html>
